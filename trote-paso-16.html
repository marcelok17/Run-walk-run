<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TROTE·PASO</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4456E3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TROTE·PASO">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Archivo:ital,wght@0,600;0,700;0,800;0,900;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  :root{
    --bg:#F0F2FA;
    --surface:#FFFFFF;
    --surface-2:#F4F5FB;
    --run:#4456E3;
    --run-dim:#E3E7FB;
    --walk:#16B97D;
    --walk-dim:#DBF5EA;
    --danger:#FF5A6E;
    --danger-dim:#FFE3E7;
    --go:#2ED477;
    --text:#1B2238;
    --text-muted:#8B90A8;
    --line:#E7E9F3;
    --shadow:0 4px 18px rgba(40,52,110,.08);
    --grad-run:linear-gradient(135deg, #4456E3 0%, #7A5CFF 100%);
    --grad-go:linear-gradient(135deg, #16B97D 0%, #2ED477 100%);
    --display:'Archivo',sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; height:100%; overflow:hidden; font-feature-settings:'tnum' 1;}
  #app{max-width:480px; margin:0 auto; height:100vh; display:flex; flex-direction:column; position:relative; background:var(--bg);}

  header{display:flex; align-items:center; justify-content:space-between; padding:18px 20px 14px; background:var(--surface); border-bottom:1px solid var(--line);}
  .brand{font-family:var(--display); font-weight:900; font-size:20px; letter-spacing:-.5px; display:flex; align-items:center; color:var(--text); font-style:italic; text-transform:uppercase;}
  .brand .run{background:var(--grad-run); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .brand .sep{color:var(--text-muted); margin:0 3px; font-weight:400; font-style:normal;}
  .brand .walk{background:var(--grad-go); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .gear{width:36px; height:36px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--text-muted); cursor:pointer; font-size:16px;}

  main{flex:1; overflow-y:auto; padding:18px 20px 10px; -webkit-overflow-scrolling:touch;}
  main::-webkit-scrollbar{display:none;}

  /* ---------- TRAIN SCREEN ---------- */
  .session-pick{display:flex; flex-direction:column; gap:10px; animation:fadein .4s ease;}
  .eyebrow{font-size:11px; font-weight:700; letter-spacing:1px; color:var(--text-muted); text-transform:uppercase; margin:18px 0 8px;}
  .eyebrow:first-child{margin-top:0;}
  .ratio-card{background:var(--surface); border:1.5px solid transparent; box-shadow:var(--shadow); border-radius:16px; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; transition:border-color .15s, transform .1s;}
  .ratio-card:active{transform:scale(.98);}
  .ratio-card.selected{border-color:var(--run); background:var(--run-dim);}
  .ratio-name{font-weight:700; font-size:15px; color:var(--text);}
  .ratio-detail{font-size:12.5px; color:var(--text-muted); margin-top:3px;}
  .ratio-pill{font-size:11px; font-weight:600; padding:4px 10px; border-radius:20px; background:var(--surface-2); color:var(--text-muted); white-space:nowrap;}

  .plan-card{background:var(--surface); box-shadow:var(--shadow); border:1.5px solid transparent; border-radius:16px; padding:14px 16px; cursor:pointer;}
  .plan-card .ratio-name{margin-bottom:2px;}
  .plan-week-bar{display:flex; gap:3px; margin-top:10px;}
  .plan-week-bar span{flex:1; height:4px; border-radius:2px; background:var(--surface-2);}
  .plan-week-bar span.done{background:var(--walk);}
  .plan-week-bar span.current{background:var(--run);}

  .start-btn{margin-top:18px; width:100%; padding:16px; border-radius:16px; border:none; background:var(--grad-run); color:#fff; font-weight:700; font-size:16px; cursor:pointer; box-shadow:0 6px 16px rgba(68,86,227,.35);}
  .start-btn:disabled{background:var(--surface-2); color:var(--text-muted); box-shadow:none;}

  /* ---------- Slide to start ---------- */
  .slide-track{position:relative; margin-top:18px; width:100%; height:58px; border-radius:30px; background:var(--grad-go); overflow:hidden; box-shadow:0 6px 16px rgba(46,212,119,.35); user-select:none;}
  .slide-label{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14.5px; letter-spacing:.2px; pointer-events:none;}
  .slide-handle{position:absolute; top:4px; left:4px; width:50px; height:50px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; color:var(--go); font-size:18px; font-weight:800; box-shadow:0 2px 6px rgba(0,0,0,.15); touch-action:none;}

  /* ---------- PRE-START MENU (estilo tarjetas 2x2) ---------- */
  .menu-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}
  .menu-card{background:var(--surface); box-shadow:var(--shadow); border-radius:16px; padding:14px; cursor:pointer; transition:transform .1s;}
  .menu-card:active{transform:scale(.97);}
  .menu-card .menu-icon{font-size:16px; color:var(--run); margin-bottom:10px; display:block;}
  .menu-card.walk-tone .menu-icon{color:var(--walk);}
  .menu-label{font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; font-weight:600;}
  .menu-value{font-weight:700; font-size:15px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text);}

  .pick-item{background:var(--surface); box-shadow:var(--shadow); border:1.5px solid transparent; border-radius:14px; padding:13px 14px; margin-bottom:8px; cursor:pointer; display:flex; justify-content:space-between; align-items:center;}
  .pick-item.selected{border-color:var(--run); background:var(--run-dim);}
  .pick-item .pi-name{font-weight:700; font-size:14px; color:var(--text);}
  .pick-item .pi-sub{font-size:11.5px; color:var(--text-muted); margin-top:2px;}
  .pick-item .pi-check{color:var(--run); font-weight:700;}
  .overlay-scroll{flex:1; overflow-y:auto;}

  .manual-btn{width:100%; margin-top:14px; padding:13px; border-radius:16px; border:1.5px dashed var(--line); background:var(--surface); color:var(--text-muted); font-weight:600; font-size:12.5px; letter-spacing:.2px; cursor:pointer;}
  .manual-btn.to-run{color:var(--run); border-color:var(--run-dim);}
  .manual-btn.to-walk{color:var(--walk); border-color:var(--walk-dim);}

  .activity-card{background:var(--surface); box-shadow:var(--shadow); border-radius:18px; margin-bottom:14px; overflow:hidden;}
  .activity-head{display:flex; align-items:center; gap:12px; padding:14px 16px 10px;}
  .activity-head .ic-circle{width:38px; height:38px; border-radius:50%; background:var(--run-dim); display:flex; align-items:center; justify-content:center; color:var(--run); flex-shrink:0;}
  .activity-head .ic-circle.walk{color:var(--walk); background:var(--walk-dim);}
  .delete-icon{width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:14px; cursor:pointer; flex-shrink:0;}
  .delete-icon:active{background:var(--danger-dim);}
  .confirm-box{background:var(--surface); border-radius:18px; padding:22px; box-shadow:var(--shadow); max-width:340px; margin:auto;}
  .confirm-box .msg{font-weight:700; font-size:15px; color:var(--text); margin-bottom:6px;}
  .confirm-box .sub{font-size:12.5px; color:var(--text-muted); margin-bottom:18px; line-height:1.5;}
  .confirm-box .row{display:flex; gap:10px;}
  .confirm-box button{flex:1; padding:12px; border-radius:12px; font-weight:700; font-size:13.5px; cursor:pointer;}
  .confirm-box .cancel{border:1.5px solid var(--line); background:var(--surface); color:var(--text);}
  .confirm-box .ok{border:none; background:var(--danger); color:#fff;}
  .activity-title{font-weight:700; font-size:14px; color:var(--text);}
  .activity-date{font-size:11.5px; color:var(--text-muted); margin-top:1px;}
  .route-map{width:100%; height:150px; background:var(--surface-2); display:block; cursor:pointer; position:relative;}
  .map-expand-hint{position:absolute; right:10px; top:10px; z-index:400; background:rgba(255,255,255,.92); border-radius:10px; padding:5px 10px; font-size:11px; font-weight:700; color:var(--run); box-shadow:0 2px 8px rgba(0,0,0,.12); pointer-events:none;}
  .map-modal{position:fixed; inset:0; z-index:1000; background:var(--bg); display:flex; flex-direction:column; animation:fadein .25s ease;}
  .map-modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; background:var(--surface); border-bottom:1px solid var(--line);}
  .map-modal-title{font-family:var(--display); font-weight:800; font-style:italic; font-size:16px;}
  .map-modal-close{width:36px; height:36px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; color:var(--text);}
  .map-modal-body{flex:1;}
  .map-modal-stats{display:grid; grid-template-columns:1fr 1fr 1fr; padding:12px 8px calc(12px + env(safe-area-inset-bottom)); background:var(--surface); border-top:1px solid var(--line);}
  .map-modal-stats div{text-align:center;}
  .route-empty{width:100%; height:80px; display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:11px; background:var(--surface-2); text-align:center; padding:0 20px;}
  .leaflet-container{background:var(--surface-2); font-family:'Inter',sans-serif;}
  .route-map .leaflet-container, .live-map .leaflet-container{isolation:isolate;}
  .route-map, .live-map{isolation:isolate; z-index:0;}
  .leaflet-control-attribution{font-size:8px !important; background:rgba(255,255,255,.75) !important; color:var(--text-muted) !important;}
  .leaflet-control-attribution a{color:var(--text-muted) !important;}
  .km-badge{background:var(--run); color:#fff; font-size:10px; font-weight:700; padding:2px 6px; border-radius:4px; white-space:nowrap; box-shadow:0 1px 4px rgba(0,0,0,.2);}
  .live-map{width:100%; height:110px; border-radius:14px; overflow:hidden; margin-top:10px; box-shadow:var(--shadow);}
  .activity-stats{display:grid; grid-template-columns:1fr 1fr 1fr 1fr; padding:14px 8px; border-top:1px solid var(--line);}
  .activity-stats div{text-align:center;}
  .as-val{font-family:var(--display); font-weight:800; font-size:16px; color:var(--text); font-style:italic;}
  .as-label{font-size:9.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; margin-top:2px; font-weight:600;}
  .splits-toggle{text-align:center; padding:10px; font-size:12px; font-weight:700; color:var(--run); cursor:pointer; border-top:1px solid var(--line);}
  .splits-wrap{padding:0 0 14px;}
  .splits-tabs{display:flex; background:var(--run); margin:0 0 4px;}
  .splits-tab{flex:1; text-align:center; padding:12px 6px; font-size:12px; font-weight:700; color:rgba(255,255,255,.6); cursor:pointer; border-bottom:3px solid transparent;}
  .splits-tab.active{color:#fff; border-bottom-color:#fff;}
  .split-header{display:flex; justify-content:space-between; padding:10px 16px 4px; font-size:11px; color:var(--text-muted); font-weight:600;}
  .split-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 16px; border-bottom:1px solid var(--line);}
  .split-tag{font-size:11px; font-weight:700; padding:3px 8px; border-radius:8px; background:var(--surface-2); color:var(--text-muted); white-space:nowrap; display:inline-block;}
  .split-tag.run{background:var(--run-dim); color:var(--run);}
  .split-tag.walk{background:var(--walk-dim); color:var(--walk);}
  .split-mid{font-size:11.5px; color:var(--text-muted); margin-top:3px;}
  .split-pace{font-size:13px; font-weight:700; color:var(--text); white-space:nowrap;}
  .split-pace-big{font-family:var(--display); font-size:18px; font-weight:800; color:var(--text); white-space:nowrap; font-style:italic;}

  /* ---------- ACTIVE SESSION ---------- */
  .active{display:flex; flex-direction:column; align-items:center; padding-top:6px; animation:fadein .4s ease;}
  .ring-wrap{position:relative; width:200px; height:200px; margin:6px 0 4px;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-bg{fill:none; stroke:var(--surface-2); stroke-width:7;}
  .ring-fg{fill:none; stroke-width:7; stroke-linecap:round; transition:stroke-dashoffset 1s linear, stroke .3s ease;}
  .ring-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .state-icon{font-size:26px; margin-bottom:6px;}
  .state-icon.run{color:var(--run);}
  .state-icon.walk{color:var(--walk);}
  .state-label{font-weight:700; font-size:13px; letter-spacing:1.5px; transition:color .3s ease; text-transform:uppercase;}
  .state-label.run{color:var(--run);}
  .state-label.walk{color:var(--walk);}
  .countdown{font-family:var(--display); font-size:44px; font-weight:800; margin-top:4px; color:var(--text); letter-spacing:-1px; font-style:italic;}
  .next-up{font-size:11px; color:var(--text-muted); margin-top:6px; letter-spacing:.3px; font-weight:600;}

  .pulse{animation:pulse .5s ease;}
  @keyframes pulse{0%{transform:scale(1);}30%{transform:scale(1.05);}100%{transform:scale(1);}}
  @keyframes fadein{from{opacity:0; transform:translateY(6px);}to{opacity:1; transform:translateY(0);}}

  .stat-card{width:100%; background:var(--surface); box-shadow:var(--shadow); border-radius:18px; padding:10px 8px; margin-top:10px;}
  .active-fixed-controls{position:fixed; bottom:calc(64px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); width:100%; max-width:480px; padding:10px 20px; background:linear-gradient(to top, var(--bg) 70%, transparent); z-index:5;}
  .stat-row{display:flex; width:100%;}
  .stat{flex:1; text-align:center; position:relative;}
  .stat:not(:last-child)::after{content:''; position:absolute; right:0; top:10%; height:80%; width:1px; background:var(--line);}
  .stat-val{font-family:var(--display); font-size:18px; font-weight:800; color:var(--text); font-style:italic;}
  .stat-label{font-size:9.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.8px; margin-top:3px; font-weight:600;}

  .ctl-row{display:flex; align-items:center; justify-content:center; gap:22px; width:100%;}
  .ctl-icon-btn{width:52px; height:52px; border-radius:50%; background:var(--surface); box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:18px; cursor:pointer;}
  .ctl-icon-btn.stop{color:var(--danger);}
  .ctl-play{width:64px; height:64px; border-radius:50%; background:var(--grad-run); display:flex; align-items:center; justify-content:center; color:#fff; font-size:22px; cursor:pointer; box-shadow:0 8px 18px rgba(68,86,227,.4);}
  .gps-note{font-size:11px; color:var(--text-muted); margin-top:14px; text-align:center; line-height:1.5;}

  /* ---------- SUMMARY ---------- */
  .summary{text-align:center; padding-top:20px; animation:fadein .4s ease;}
  .summary .check{width:64px; height:64px; border-radius:50%; background:var(--walk-dim); color:var(--walk); display:flex; align-items:center; justify-content:center; font-size:30px; margin:0 auto 14px;}
  .summary h2{margin:0 0 4px; font-size:20px; font-weight:800; color:var(--text);}
  .summary p{color:var(--text-muted); font-size:13px; margin:0 0 18px;}

  /* ---------- HISTORY ---------- */
  .empty-state{text-align:center; padding:60px 20px; color:var(--text-muted);}
  .empty-state .glyph{font-size:34px; margin-bottom:10px;}
  .empty-state p{font-size:13px; line-height:1.6; margin:0;}

  /* ---------- NAV ---------- */
  nav{display:flex; border-top:1px solid var(--line); background:var(--surface); padding:8px 10px calc(8px + env(safe-area-inset-bottom));}
  .navbtn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 4px; cursor:pointer; color:var(--text-muted); font-size:10.5px; letter-spacing:.2px; font-weight:600; border-radius:14px;}
  .navbtn .ic{font-size:18px;}
  .navbtn.active{color:var(--run); background:var(--run-dim);}

  .settings-overlay{position:absolute; inset:0; background:var(--bg); display:flex; flex-direction:column; padding:20px; z-index:900; animation:fadein .25s ease;}
  .settings-overlay h3{margin:0 0 18px; font-weight:800; color:var(--text);}
  .toggle-row{display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--line);}
  .toggle-row .lbl{font-size:14px; font-weight:600; color:var(--text);}
  .toggle-row .sub{font-size:11.5px; color:var(--text-muted); margin-top:2px;}
  .switch{width:44px; height:26px; border-radius:14px; background:var(--surface-2); position:relative; cursor:pointer; flex-shrink:0; border:1px solid var(--line);}
  .switch.on{background:var(--run); border-color:var(--run);}
  .switch::after{content:''; position:absolute; width:20px; height:20px; border-radius:50%; background:#fff; top:2px; left:2px; transition:left .2s; box-shadow:0 1px 3px rgba(0,0,0,.2);}
  .switch.on::after{left:21px;}
  .close-settings{margin-top:auto; padding:14px; border-radius:16px; border:1.5px solid var(--line); background:var(--surface); color:var(--text); font-weight:700; cursor:pointer;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="run">TROTE</span><span class="sep">·</span><span class="walk">PASO</span></div>
    <div class="gear" id="gearBtn">⚙</div>
  </header>
  <main id="main"></main>
  <nav id="nav">
    <div class="navbtn active" data-screen="train"><span class="ic">▷</span>Entrenar</div>
    <div class="navbtn" data-screen="plans"><span class="ic">▤</span>Planes</div>
    <div class="navbtn" data-screen="history"><span class="ic">◷</span>Historial</div>
  </nav>
</div>

<script>
/* ============== DATA: RATIOS & PLANS (framework estándar run-walk-run) ============== */
const RATIOS = [
  {id:'f1', name:'Fase 1 · Principiante', run:30, walk:60, detail:'30s trote / 1 min caminata'},
  {id:'f2', name:'Fase 2', run:60, walk:60, detail:'1 min trote / 1 min caminata'},
  {id:'f3', name:'Fase 3', run:120, walk:60, detail:'2 min trote / 1 min caminata'},
  {id:'f4', name:'Fase 4', run:240, walk:60, detail:'4 min trote / 1 min caminata'},
  {id:'f5', name:'Fase 5', run:480, walk:120, detail:'8 min trote / 2 min caminata'},
];
const DURATIONS = [10,20,30,40,45,60];
const ACTIVITIES = [
  {id:'running', name:'Running', detail:'Entrenamiento con intervalos de trote y caminata'},
  {id:'walking', name:'Caminata libre', detail:'Sesión continua de caminata, sin intervalos de trote'},
];
const MUSIC_OPTIONS = [
  {id:'ninguna', name:'Ninguna'},
  {id:'spotify', name:'Spotify'},
  {id:'apple', name:'Apple Music'},
  {id:'dispositivo', name:'Música del dispositivo'},
];
const AUDIO_STATS = [
  {id:'km', name:'Por kilómetro', detail:'Anuncia distancia y ritmo cada vez que completas 1 km'},
  {id:'tiempo', name:'Tiempo (cada 5 min)', detail:'Anuncia el tiempo transcurrido cada 5 min'},
  {id:'distancia', name:'Distancia (cada 5 min)', detail:'Anuncia la distancia recorrida cada 5 min'},
  {id:'ritmo', name:'Ritmo (cada 5 min)', detail:'Anuncia el ritmo actual cada 5 min'},
  {id:'ninguna', name:'Ninguna', detail:'Sin anuncios periódicos, solo cambios de trote/caminata'},
];

const PLANS = [
  {
    id:'5k-galloway', name:'5K · Jeff Galloway', source:'jeffgalloway.com', sessionsPerWeek:'Mar/Jue: trote-camina · Dom: carrera larga · Lun/Mié/Vie: caminar o XT · Sáb: descanso',
    weeks:[
      {n:1, runMin:15, longMiles:1},
      {n:2, runMin:15, longMiles:1},
      {n:3, runMin:20, longMiles:1.5},
      {n:4, runMin:20, longMiles:1.5},
      {n:5, runMin:25, longMiles:2},
      {n:6, runMin:25, longMiles:2},
      {n:7, runMin:30, longMiles:2.5},
      {n:8, runMin:30, longMiles:2.5},
      {n:9, runMin:30, longMiles:3},
      {n:10, runMin:30, longMiles:3},
      {n:11, runMin:30, longMiles:3.5},
      {n:12, runMin:30, longMiles:3.5},
      {n:13, runMin:30, longMiles:4},
      {n:14, runMin:30, longMiles:4},
      {n:15, runMin:30, longMiles:3.1, isRace:true},
    ]
  },
  {
    id:'10k-galloway', name:'10K · Jeff Galloway', source:'jeffgalloway.com', sessionsPerWeek:'Mar/Jue: trote-camina · Dom: carrera larga · Lun/Mié/Vie: caminar o XT · Sáb: descanso',
    weeks:[
      {n:1, runMin:25, longMiles:2},
      {n:2, runMin:25, longMiles:2},
      {n:3, runMin:30, longMiles:3},
      {n:4, runMin:30, longMiles:4},
      {n:5, runMin:35, longMiles:4},
      {n:6, runMin:35, longMiles:5},
      {n:7, runMin:45, longMiles:5},
      {n:8, runMin:45, longMiles:6},

      {n:12, runMin:45, longMiles:4},
      {n:13, runMin:45, longMiles:6.2, isRace:true},
    ]
  }
];
function getPlan(id){ return PLANS.find(p=>p.id===id); }
function estimateLongRunMinutes(miles){ return Math.round(miles*13); } // ritmo conservador run-walk ~13 min/milla
function autoRatioForWeek(weekNum){
  // Progresión conservadora: sube un nivel de relación cada 2 semanas, partiendo de la más suave
  const stage = Math.min(Math.floor((weekNum-1)/2), RATIOS.length-1);
  return RATIOS[stage];
}
function toDateStr(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function todayStr(){ return toDateStr(new Date()); }
const DAY_PATTERN = ['walkxt','run','walkxt','run','walkxt','rest','longrun']; // Lun..Dom
const DAY_NAMES = ['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
function buildSchedule(planId, startDateStr, startWeek){
  const plan = getPlan(planId);
  const start = new Date(startDateStr+'T00:00:00');
  const firstWeekIdx = Math.max(0, (startWeek||1)-1);
  const days = [];
  const totalWeeks = plan.weeks.length - firstWeekIdx;
  for(let i=0;i<totalWeeks*7;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const weekIdx = firstWeekIdx + Math.floor(i/7);
    const w = plan.weeks[weekIdx];
    // El patrón semanal se alinea al día real de la semana (lunes=walkxt ... domingo=longrun)
    const dow = (d.getDay()+6)%7; // 0=lunes ... 6=domingo
    const type = DAY_PATTERN[dow];
    days.push({
      date: toDateStr(d), weekNum: weekIdx+1, type,
      runMin: type==='run' ? w.runMin : null,
      longMiles: type==='longrun' ? w.longMiles : null,
      isRace: type==='longrun' ? !!w.isRace : false,
      completed:false
    });
  }
  return {planId, startDate: startDateStr, startWeek: firstWeekIdx+1, days};
}
function autoSyncScheduleWithHistory(){
  // Marca como completados los días del plan cuya fecha coincide con una sesión ya registrada
  if(!state.schedule) return false;
  let changed = false;
  state.schedule.days.forEach(day=>{
    if(day.completed) return;
    if(day.type!=='run' && day.type!=='longrun') return;
    const match = state.history.find(h=>{
      const hDate = toDateStr(new Date(h.date));
      return hDate === day.date && !h.isWalkOnly;
    });
    if(match){ day.completed = true; changed = true; }
  });
  if(changed) persistSchedule();
  return changed;
}

/* ============== HELPERS ============== */
function fmt(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function buildIntervals(runSec, walkSec, totalMinutes){
  const intervals = [];
  let elapsed = 0;
  const totalSec = totalMinutes*60;
  let toggleRun = true;
  while(elapsed < totalSec){
    const dur = toggleRun ? runSec : walkSec;
    intervals.push({type: toggleRun?'run':'walk', seconds: dur});
    elapsed += dur;
    toggleRun = !toggleRun;
  }
  return intervals;
}
function speak(text){
  if(!state.settings.voice) return;
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'es-ES'; u.rate = 1.0;
    speechSynthesis.speak(u);
  }catch(e){}
}
async function notify(title, body){
  // Notificación nativa del sistema — funciona aunque la pantalla esté bloqueada
  if(!state.settings.voice) return;
  if(!('Notification' in window)) return;
  if(Notification.permission !== 'granted') return;
  try{
    const reg = await navigator.serviceWorker.ready;
    reg.showNotification(title, {body, icon:'icon-192.png', tag:'trote-paso-cue', silent:false});
  }catch(e){
    // Fallback si el SW no está disponible
    try{ new Notification(title, {body, icon:'icon-192.png', silent:false}); }catch(e2){}
  }
}
function announceKm(km, paceSecPerKm){
  const paceText = paceSecPerKm>0 ? fmt(paceSecPerKm).replace(':',' minutos ')+' segundos por kilómetro' : '';
  const msg = `Kilómetro ${km}${paceText ? ' — ritmo '+paceText : ''}`;
  speak(msg);
  notify(`Km ${km} completado`, paceText ? `Ritmo: ${fmt(paceSecPerKm)}/km` : '');
}
function announceInterval(type){
  const msg = type==='run' ? 'Trota' : 'Camina';
  speak(msg);
  notify(type==='run' ? '▶ Trota' : '◆ Camina', '');
}
function vibrate(pattern){
  if(!state.settings.vibrate) return;
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
}
function haversine(lat1,lon1,lat2,lon2){
  const R=6371, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function startScheduledDay(dateStr){
  const day = state.schedule.days.find(d=>d.date===dateStr);
  if(!day) return;
  const r = autoRatioForWeek(day.weekNum);
  if(day.type==='run'){
    startSession(r.run, r.walk, day.runMin, {planId:state.schedule.planId, weekNum:day.weekNum, sessionType:'short', scheduleDate:dateStr});
  } else if(day.type==='longrun'){
    const minutes = estimateLongRunMinutes(day.longMiles);
    startSession(r.run, r.walk, minutes, {planId:state.schedule.planId, weekNum:day.weekNum, sessionType:'long', scheduleDate:dateStr});
  }
}
async function fetchHeartRate(){
  if(!state.settings.proxyUrl) return null;
  try{
    const r = await fetch(state.settings.proxyUrl+'/api/heartrate/current', {
      headers: state.settings.proxySecret ? {'x-proxy-secret': state.settings.proxySecret} : {},
      signal: AbortSignal.timeout ? AbortSignal.timeout(5000) : undefined
    });
    if(!r.ok) return null;
    const data = await r.json();
    return (data && typeof data.bpm === 'number') ? data : null;
  }catch(e){ return null; }
}
function startHrPolling(){
  if(!state.settings.proxyUrl) return;
  state.hrPollHandle = setInterval(async ()=>{
    if(!state.session || state.session.paused) return;
    const r = await fetchHeartRate();
    if(r && r.bpm>30 && r.bpm<240){ state.session.hrLog.push({t: state.session.totalElapsed, bpm: r.bpm}); }

let btDevice = null, btCharacteristic = null;

async function btPair(){
  // Emparejamiento inicial — requiere gesto del usuario (botón en Ajustes). Solo una vez.
  if(!('bluetooth' in navigator)){
    alert('Este navegador no soporta Web Bluetooth. Usa Chrome o Samsung Internet en Android.');
    return false;
  }
  try{
    btDevice = await navigator.bluetooth.requestDevice({
      filters:[{services:['heart_rate']}]
    });
    state.btDeviceName = btDevice.name || 'Sensor FC';
    try{ localStorage.setItem('tp_bt-device-name', state.btDeviceName); }catch(e){}
    await btConnect();
    return true;
  }catch(e){
    return false; // usuario canceló o falló
  }
}
async function btReconnectSilent(){
  // Reconexión sin diálogo, usando el dispositivo previamente autorizado.
  if(btDevice) return btConnect();
  if(!('bluetooth' in navigator) || !navigator.bluetooth.getDevices) return false;
  try{
    const devices = await navigator.bluetooth.getDevices();
    if(devices.length === 0) return false;
    btDevice = devices[0];
    return btConnect();
  }catch(e){ return false; }
}
async function btConnect(){
  if(!btDevice) return false;
  try{
    const server = await btDevice.gatt.connect();
    const service = await server.getPrimaryService('heart_rate');
    btCharacteristic = await service.getCharacteristic('heart_rate_measurement');
    await btCharacteristic.startNotifications();
    btCharacteristic.addEventListener('characteristicvaluechanged', onBtHr);
    btDevice.addEventListener('gattserverdisconnected', ()=>{ state.btLiveHr = null; updateLiveHrDisplay(); });
    return true;
  }catch(e){ return false; }
}
function onBtHr(event){
  const value = event.target.value;
  const flags = value.getUint8(0);
  const bpm = (flags & 0x01) ? value.getUint16(1, true) : value.getUint8(1);
  if(bpm > 30 && bpm < 240){
    state.btLiveHr = bpm;
    if(state.session && !state.session.paused){
      const last = state.session.hrLog[state.session.hrLog.length-1];
      if(!last || last.t !== state.session.totalElapsed){
        state.session.hrLog.push({t: state.session.totalElapsed, bpm});
      }
    }
    updateLiveHrDisplay();
  }
}
function updateLiveHrDisplay(){
  const el = document.getElementById('liveHr');
  if(el) el.textContent = state.btLiveHr ? '♥ '+state.btLiveHr : '—';
}
function btDisconnect(){

}

/* ============== WAKE LOCK + VISIBILITYCHANGE ============== */
let wakeLock = null;
async function requestWakeLock(){
  if(!('wakeLock' in navigator)) return;
  try{
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', ()=>{ wakeLock=null; });
  }catch(e){}
}
async function releaseWakeLock(){
  if(wakeLock){ try{ await wakeLock.release(); }catch(e){} wakeLock=null; }
}

// Al volver al frente: reenganchamos Wake Lock, recalculamos el tiempo real y reconectamos GPS
document.addEventListener('visibilitychange', async ()=>{
  if(document.visibilityState === 'visible'){
    if(state.session && !state.session.paused){
      await requestWakeLock();
      if(state.settings.gps && state.gpsWatch == null) startGps();
      // El timer ya usa Date.now() internamente — basta con hacer un render
      renderActiveStatsOnly();
    }
  }
});

function startSession(runSec, walkSec, minutes, planMeta){
  const isWalkOnly = state.pre.activityId === 'walking';
  const intervals = isWalkOnly
    ? [{type:'walk', seconds: minutes*60}]
    : buildIntervals(runSec, walkSec, minutes);
  const now = Date.now();
  state.session = {
    intervals, idx:0, remaining: intervals[0].seconds,
    totalElapsed:0, distanceKm:0, lastPos:null, paused:false,
    planMeta: planMeta || null, lastAnnounceBlock:0,
    ratioRun: runSec, ratioWalk: walkSec,
    routePoints:[], isWalkOnly,
    intervalLog:[], curIntervalStartElapsed:0, curIntervalStartDist:0,
    hrLog:[], _startWall: now, _pausedAt: null, _pausedTotal: 0,
    nextKmAnnounce: 1  // próximo km a anunciar
  };
  requestWakeLock();
  startGps();
  startHrPolling();
  btReconnectSilent(); // reconexión al reloj emparejado, sin diálogo — el deslizar cuenta como gesto
  speak(intervals[0].type==='run' ? 'Comienza a trotar' : 'Comienza a caminar');
  vibrate(200);
  state.timerHandle = setInterval(tick, 1000);
  state.screen = 'active';
  render();
}
function startGps(){
  state.gpsStatus = 'idle';
  if(!state.settings.gps){ state.gpsStatus='off'; return; }
  if(!('geolocation' in navigator)){ state.gpsStatus='unsupported'; return; }
  state.gpsStatus = 'searching';
  try{
    state.gpsWatch = navigator.geolocation.watchPosition(pos=>{
      state.gpsStatus = 'active';
      if(!state.session || state.session.paused) return;
      const {latitude, longitude} = pos.coords;
      if(state.session.lastPos){
        const d = haversine(state.session.lastPos.lat, state.session.lastPos.lon, latitude, longitude);
        if(d < 0.2){ state.session.distanceKm += d; } // filtro de saltos GPS irreales
      }
      state.session.lastPos = {lat:latitude, lon:longitude};
      state.session.routePoints.push({lat:latitude, lon:longitude, d:state.session.distanceKm, t:state.session.totalElapsed});
      if(liveMapLine){ liveMapLine.addLatLng([latitude,longitude]); }
      if(liveMapInstance){ liveMapInstance.panTo([latitude,longitude], {animate:true}); }
      renderActiveStatsOnly();
      updateGpsBadge();
    }, err=>{
      state.gpsStatus = err.code===1 ? 'denied' : (err.code===2 ? 'unavailable' : 'timeout');
      updateGpsBadge();
    }, {enableHighAccuracy:true, maximumAge:2000, timeout:15000});
  }catch(e){ state.gpsStatus='error'; }
  updateGpsBadge();
}
function gpsStatusText(){
  const map = {
    idle:'GPS inactivo', off:'GPS desactivado en ajustes', searching:'Buscando señal GPS…',
    active:'GPS activo · '+(state.session?state.session.routePoints.length:0)+' puntos registrados',
    denied:'Permiso de ubicación denegado por el navegador', unavailable:'Posición no disponible',
    timeout:'Tiempo de espera agotado buscando GPS', unsupported:'Este navegador no soporta geolocalización',
    error:'Error iniciando GPS'
  };
  return map[state.gpsStatus] || 'GPS inactivo';
}
function updateGpsBadge(){
  const el = document.getElementById('gpsBadge');
  if(el) el.textContent = gpsStatusText();
}
function stopGps(){
  if(state.gpsWatch!=null){ try{ navigator.geolocation.clearWatch(state.gpsWatch); }catch(e){} state.gpsWatch=null; }
}
function logCurrentInterval(s){
  const type = s.intervals[s.idx].type;
  const durationSec = s.totalElapsed - s.curIntervalStartElapsed;
  const distKm = Math.max(0, s.distanceKm - s.curIntervalStartDist);
  if(durationSec>0) s.intervalLog.push({type, durationSec, distKm});
}
function getElapsed(s){
  // Tiempo real transcurrido en segundos, descontando pausas
  const pausedMs = s.paused ? (Date.now() - s._pausedAt) : 0;
  return Math.floor((Date.now() - s._startWall - s._pausedTotal - pausedMs) / 1000);
}
function tick(silent=false){
  const s = state.session;
  if(!s || s.paused) return;

  const newElapsed = getElapsed(s);
  const delta = newElapsed - s.totalElapsed; // puede ser > 1 si se perdieron ticks
  if(delta <= 0) return;
  s.totalElapsed = newElapsed;

  // Avanzar remaining restando el delta real
  s.remaining = Math.max(0, s.remaining - delta);

  if(s.remaining <= 0){
    logCurrentInterval(s);
    s.idx++;
    if(s.idx >= s.intervals.length){
      finishSession();
      return;
    }
    const cur = s.intervals[s.idx];
    s.remaining = cur.seconds;
    s.curIntervalStartElapsed = s.totalElapsed;
    s.curIntervalStartDist = s.distanceKm;
    if(!silent){
      announceInterval(cur.type);
      vibrate(cur.type==='run' ? [120] : [60,60,60]);
      render();
      const ring = document.querySelector('.ring-wrap');
      if(ring){ ring.classList.remove('pulse'); requestAnimationFrame(()=>ring.classList.add('pulse')); }
    }
    return;
  }
  if(!silent){
    if(s.remaining <= 5 && s.remaining > 0 && delta === 1) speak(String(s.remaining));
    // Aviso por kilómetro — se dispara cuando se cruza cada km
    if(state.pre.audioStatId === 'km' && s.distanceKm >= s.nextKmAnnounce){
      const paceSecPerKm = s.totalElapsed > 0 && s.distanceKm > 0.05 ? s.totalElapsed/s.distanceKm : 0;
      announceKm(s.nextKmAnnounce, paceSecPerKm);
      s.nextKmAnnounce++;
    }
    // Avisos periódicos cada 5 min
    const block = Math.floor(s.totalElapsed/300);
    if(block > s.lastAnnounceBlock && ['tiempo','distancia','ritmo'].includes(state.pre.audioStatId)){
      s.lastAnnounceBlock = block;
      if(state.pre.audioStatId==='tiempo'){
        const msg = 'Tiempo '+fmt(s.totalElapsed).replace(':',' minutos ')+' segundos';
        speak(msg); notify('⏱ Tiempo', fmt(s.totalElapsed));
      } else if(state.pre.audioStatId==='distancia'){
        const msg = 'Distancia '+s.distanceKm.toFixed(2)+' kilómetros';
        speak(msg); notify('📍 Distancia', s.distanceKm.toFixed(2)+' km');
      } else if(state.pre.audioStatId==='ritmo' && s.distanceKm>0.05){
        const pace = fmt(s.totalElapsed/s.distanceKm);
        speak('Ritmo '+pace.replace(':',' minutos ')+' por kilómetro');
        notify('⚡ Ritmo', pace+'/km');
      }
    }
    renderActiveStatsOnly();
  }
}
function pauseToggle(){
  if(!state.session) return;
  const s = state.session;
  if(!s.paused){
    s.paused = true;
    s._pausedAt = Date.now();
    releaseWakeLock();
  } else {
    s._pausedTotal += Date.now() - s._pausedAt;
    s._pausedAt = null;
    s.paused = false;
    requestWakeLock();
  }
  render();
}
function manualSwitch(toType){
  const s = state.session;
  if(!s || s.isWalkOnly) return;
  logCurrentInterval(s);
  const dur = toType==='run' ? s.ratioRun : s.ratioWalk;
  s.intervals[s.idx] = {type:toType, seconds:dur};
  s.remaining = dur;
  s.curIntervalStartElapsed = s.totalElapsed;
  s.curIntervalStartDist = s.distanceKm;
  announceInterval(toType);
  vibrate(toType==='run' ? [120] : [60,60,60]);
  render();
  const ring = document.querySelector('.ring-wrap');
  if(ring){ ring.classList.remove('pulse'); requestAnimationFrame(()=>ring.classList.add('pulse')); }
}
function downsampleRoute(points, maxPoints){
  if(points.length<=maxPoints) return points;
  const step = points.length/maxPoints;
  const out = [];
  for(let i=0;i<maxPoints;i++) out.push(points[Math.floor(i*step)]);
  out.push(points[points.length-1]);
  return out;
}
function estimateCalories(totalSec, runSec, walkSec){
  // MET: trote ~9.8, caminata ~3.5, peso asumido 70kg
  const weightKg = 70;
  const hours = totalSec/3600;
  const runFrac = (runSec+walkSec)>0 ? runSec/(runSec+walkSec) : 0;
  const met = 9.8*runFrac + 3.5*(1-runFrac);
  return Math.round(met*weightKg*hours);
}
function computeKmSplits(routePoints){
  if(!routePoints || routePoints.length<2) return [];
  const splits = [];
  let nextKm = 1, lastT = 0;
  routePoints.forEach(p=>{
    if(p.d!=null && p.d>=nextKm){
      splits.push({km:nextKm, sec: Math.max(0,(p.t||0)-lastT)});
      lastT = p.t||0;
      nextKm++;
    }
  });
  return splits;
}
function finishSession(){
  clearInterval(state.timerHandle);
  stopGps();
  stopHrPolling();
  releaseWakeLock();
  const s = state.session;
  let runSecTotal = 0, walkSecTotal = 0;
  s.intervalLog.forEach(log=>{
    if(log.type==='run') runSecTotal += log.durationSec; else walkSecTotal += log.durationSec;
  });
  let avgHr = null, maxHr = null;
  if(s.hrLog && s.hrLog.length>0){
    const bpms = s.hrLog.map(h=>h.bpm);
    avgHr = Math.round(bpms.reduce((a,b)=>a+b,0)/bpms.length);
    maxHr = Math.round(Math.max(...bpms));
  }
  const record = {
    date: new Date().toISOString(),
    durationSec: s.totalElapsed,
    distanceKm: Math.round(s.distanceKm*100)/100,
    runSec: runSecTotal,
    walkSec: walkSecTotal,
    calories: estimateCalories(s.totalElapsed, runSecTotal, walkSecTotal),
    isWalkOnly: s.isWalkOnly,
    activityId: state.pre.activityId,
    intervalLog: s.intervalLog,
    kmSplits: computeKmSplits(s.routePoints),
    avgHr, maxHr, hrLog: s.hrLog,
    route: downsampleRoute(s.routePoints, 120),
    planMeta: s.planMeta
  };
  state.history.unshift(record);
  state.history = state.history.slice(0,200);
  persistHistory();
  if(s.planMeta && s.planMeta.sessionType==='long'){
    const cur = state.planProgress[s.planMeta.planId] || 0;
    state.planProgress[s.planMeta.planId] = Math.max(cur, s.planMeta.weekNum);
    persistProgress();
  }
  if(s.planMeta && s.planMeta.scheduleDate && state.schedule){
    const day = state.schedule.days.find(d=>d.date===s.planMeta.scheduleDate);
    if(day){ day.completed = true; persistSchedule(); }
  }
  autoSyncScheduleWithHistory();
  speak('Sesión completada. Buen trabajo.');
  state.screen = 'summary';
  state.lastSummary = record;
  state.session = null;
  render();
}
function stopSession(){
  clearInterval(state.timerHandle);
  stopGps();
  stopHrPolling();
  releaseWakeLock();
  if(state.session && state.session.totalElapsed > 20){
    logCurrentInterval(state.session);
    finishSession();
  } else {
    state.session = null;
    state.screen = 'train';
    render();
  }
}

function updateRing(){
  const s = state.session;
  if(!s) return;
  const circle = document.getElementById('ringFg');
  if(!circle) return;
  const total = s.intervals[s.idx].seconds;
  const frac = 1 - (s.remaining/total);
  const r = 88, C = 2*Math.PI*r;
  circle.style.strokeDasharray = C;
  circle.style.strokeDashoffset = C*(1-frac);
  circle.style.stroke = s.intervals[s.idx].type==='run' ? 'var(--run)' : 'var(--walk)';
}

function weeklySummary(){

  return {count:recent.length, km:km.toFixed(1)};

function dayTypeLabel(day){
  if(day.type==='walkxt') return 'Caminata o cruzado';
  if(day.type==='rest') return 'Descanso';
  const ratio = autoRatioForWeek(day.weekNum);
  if(day.type==='run') return `Trote-camina · ${day.runMin} min · ${ratio.detail}`;
  if(day.type==='longrun') return (day.isRace?'🏁 Carrera · ':'Carrera larga · ')+day.longMiles+' mi · '+ratio.detail;
  return '';
}
function formatDayHeader(dateStr){

}

function deleteHistoryRecord(idx){
  const h = state.history[idx];
  if(!h) return;
  state.history.splice(idx,1);
  persistHistory();
  if(h.planMeta && h.planMeta.scheduleDate && state.schedule){
    const day = state.schedule.days.find(d=>d.date===h.planMeta.scheduleDate);
    if(day){ day.completed = false; persistSchedule(); }
  }
  if(h.planMeta && h.planMeta.sessionType==='long'){
    const cur = state.planProgress[h.planMeta.planId];
    if(cur === h.planMeta.weekNum){
      state.planProgress[h.planMeta.planId] = Math.max(0, cur-1);
      persistProgress();
    }
  }
  state.expandedHistory = new Set();
  state.splitsTab = {};
  render();
}
function paceFromSecKm(sec, km){
  if(!km || km<=0.02) return '—';
  return fmt(sec/km)+'/km';
}
function renderSplits(h, idx){
  const tab = state.splitsTab && state.splitsTab[idx] || 'km';
  let html = '<div class="splits-wrap">';
  html += `<div class="splits-tabs">
    <div class="splits-tab ${tab==='km'?'active':''}" data-action="splits-tab" data-idx="${idx}" data-tab="km">Kilómetros</div>
    <div class="splits-tab ${tab==='interval'?'active':''}" data-action="splits-tab" data-idx="${idx}" data-tab="interval">Intervalos del entrenamiento</div>
  </div>`;
  if(tab==='km'){
    if(h.kmSplits && h.kmSplits.length>0){
      html += `<div class="split-header"><span>Kilómetro</span><span>Ritmo</span></div>`;
      h.kmSplits.forEach(s=>{
        html += `<div class="split-row">
          <div class="split-tag">Km ${s.km}</div>
          <div class="split-pace-big">${fmt(s.sec)}/km</div>
        </div>`;
      });
    } else {
      html += `<div class="route-empty">Sin parciales por kilómetro para esta sesión</div>`;
    }
  } else {
    if(h.intervalLog && h.intervalLog.length>0){
      html += `<div class="split-header"><span>Intervalo</span><span>Ritmo</span></div>`;
      h.intervalLog.forEach(log=>{
        const pace = paceFromSecKm(log.durationSec, log.distKm);
        html += `<div class="split-row">
          <div><div class="split-tag ${log.type}">${log.type==='run'?'Trote':'Camina'}</div><div class="split-mid">${fmt(log.durationSec)} · ${log.distKm.toFixed(2)} km</div></div>
          <div class="split-pace-big">${pace}</div>
        </div>`;
      });
    } else {
      html += `<div class="route-empty">Sin intervalos registrados para esta sesión</div>`;
    }
  }
  html += '</div>';
  return html;
}

let historyMaps = [];
let liveMapInstance = null, liveMapLine = null;
function destroyLiveMap(){

}
function initLiveMap(){
  destroyLiveMap();
  if(typeof L === 'undefined' || !state.settings.gps) return;
  const el = document.getElementById('liveMap');

    let nextKm = 1, lastD = 0;
    h.route.forEach(p=>{
      if(p.d!=null && p.d>=nextKm && lastD<nextKm){

        nextKm++;
      }
      if(p.d!=null) lastD = p.d;

    expandedMapInstance.fitBounds(L.latLngBounds(coords), {padding:[30,30]});
  });

    const el = document.getElementById('hmap-'+idx);

    const coords = h.route.map(p=>[p.lat,p.lon]);
    const map = L.map(el, {zoomControl:false, dragging:false, scrollWheelZoom:false, doubleClickZoom:false, boxZoom:false, keyboard:false, touchZoom:false, attributionControl:true});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution:'© OpenStreetMap contributors', maxZoom:19
    }).addTo(map);
    L.polyline(coords, {color:'#4456E3', weight:4, lineCap:'round', lineJoin:'round'}).addTo(map);
    L.circleMarker(coords[0], {radius:6, color:'#fff', weight:2, fillColor:'#16B97D', fillOpacity:1}).addTo(map);
    L.circleMarker(coords[coords.length-1], {radius:6, color:'#fff', weight:2, fillColor:'#FF5A6E', fillOpacity:1}).addTo(map);
    let nextKm = 1, lastD = 0;
    h.route.forEach(p=>{
      if(p.d!=null && p.d>=nextKm && lastD<nextKm){
        L.marker([p.lat,p.lon], {icon: L.divIcon({className:'', html:`<div class="km-badge">${nextKm}km</div>`, iconSize:[36,18], iconAnchor:[18,28]})}).addTo(map);
        nextKm++;
      }
      if(p.d!=null) lastD = p.d;
    });
    map.fitBounds(L.latLngBounds(coords), {padding:[16,16]});
    map.on('click', ()=> openMapModal(idx));
    historyMaps.push(map);
  });
}

function attachHandlers(){
  const slideHandle = document.getElementById('slideHandle');
  const slideTrack = document.getElementById('slideStart');
  if(slideHandle && slideTrack){
    let dragging=false, startX=0, maxX=0;
    const doStart = ()=>{
      const e = state.pre.entrenamiento;
      const r = RATIOS.find(x=>x.id===e.ratioId) || RATIOS[0];
      startSession(r.run, r.walk, e.minutes, null);
    };
    const getX = ev => (ev.touches ? ev.touches[0].clientX : ev.clientX);
    const onMove = ev=>{
      if(!dragging) return;
      const dx = Math.max(0, Math.min(maxX, getX(ev)-startX));
      slideHandle.style.left = (4+dx)+'px';
      if(dx >= maxX-4){ endDrag(true); }
    };
    const endDrag = (completed)=>{
      if(!dragging) return;
      dragging=false;
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onUp);
      if(completed){ doStart(); }
      else { slideHandle.style.transition='left .2s ease'; slideHandle.style.left='4px'; setTimeout(()=>{ if(slideHandle) slideHandle.style.transition=''; },200); }
    };
    const onUp = ()=> endDrag(false);
    const onDown = ev=>{
      dragging=true;
      startX = getX(ev);
      maxX = slideTrack.clientWidth - slideHandle.clientWidth - 8;
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      document.addEventListener('touchmove', onMove, {passive:true});
      document.addEventListener('touchend', onUp);
    };
    slideHandle.addEventListener('mousedown', onDown);
    slideHandle.addEventListener('touchstart', onDown, {passive:true});
  }
  const openAct = document.querySelector('[data-action="open-activity"]');
  if(openAct) openAct.onclick = openActivityPicker;
  const openEnt = document.querySelector('[data-action="open-entrenamiento"]');
  if(openEnt) openEnt.onclick = openEntrenamientoPicker;
  const openMus = document.querySelector('[data-action="open-music"]');
  if(openMus) openMus.onclick = openMusicPicker;
  const openAud = document.querySelector('[data-action="open-audio"]');
  if(openAud) openAud.onclick = openAudioPicker;

  document.querySelectorAll('[data-action="open-plan-detail"]').forEach(el=>{
    el.onclick = ()=> openStartPlanPicker(el.dataset.plan);
  });
  document.querySelectorAll('[data-action="delete-history"]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const idx = parseInt(el.dataset.idx);
      showConfirm('¿Eliminar este entrenamiento?', 'Se borrará del historial. Si correspondía a un día del plan, ese día quedará disponible para repetirlo.', ()=> deleteHistoryRecord(idx));
    };
  });
  document.querySelectorAll('[data-action="splits-tab"]').forEach(el=>{
    el.onclick = ()=>{
      const idx = parseInt(el.dataset.idx);
      state.splitsTab[idx] = el.dataset.tab;
      render();
    };
  });
  document.querySelectorAll('[data-action="toggle-splits"]').forEach(el=>{
    el.onclick = ()=>{
      const idx = parseInt(el.dataset.idx);
      if(state.expandedHistory.has(idx)) state.expandedHistory.delete(idx);
      else state.expandedHistory.add(idx);
      render();
    };
  });
  document.querySelectorAll('[data-action="toggle-week"]').forEach(el=>{
    el.onclick = ()=>{
      const wk = parseInt(el.dataset.week);
      if(state.expandedWeeks.has(wk)) state.expandedWeeks.delete(wk);
      else state.expandedWeeks.add(wk);
      render();
    };
  });
  document.querySelectorAll('[data-action="start-sched-day"]').forEach(el=>{
    el.onclick = ()=> startScheduledDay(el.dataset.date);
  });
  document.querySelectorAll('[data-action="mark-day"]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const day = state.schedule.days.find(d=>d.date===el.dataset.date);
      if(day){ day.completed = true; persistSchedule(); render(); }
    };
  });
  document.querySelectorAll('[data-action="unmark-day"]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      showConfirm('¿Desmarcar este día?', 'Volverá a quedar disponible para entrenarlo.', ()=>{
        const day = state.schedule.days.find(d=>d.date===el.dataset.date);
        if(day){ day.completed = false; persistSchedule(); render(); }
      }, 'Desmarcar');
    };
  });
  const clearSched = document.querySelector('[data-action="clear-schedule"]');
  if(clearSched) clearSched.onclick = (e)=>{
    e.stopPropagation();
    state.schedule = null;
    persistSchedule();
    render();
  };
  const pauseBtn = document.querySelector('[data-action="pause"]');
  if(pauseBtn) pauseBtn.onclick = pauseToggle;
  const stopBtn = document.querySelector('[data-action="stop"]');
  if(stopBtn) stopBtn.onclick = stopSession;
  const manualBtn = document.querySelector('[data-action="manual-switch"]');
  if(manualBtn) manualBtn.onclick = ()=> manualSwitch(manualBtn.dataset.to);
  const backTrain = document.querySelector('[data-action="back-train"]');
  if(backTrain) backTrain.onclick = ()=>{ state.screen='train'; render(); };
}

    <input type="text" id="proxySecretInput" placeholder="Token secreto del proxy" value="${state.settings.proxySecret||''}" style="width:100%; padding:12px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface-2); color:var(--text); margin-bottom:10px; font-family:'Inter',sans-serif;">
    <button class="manual-btn" id="testProxyBtn" style="border-style:solid;">Probar conexión</button>

    </div>
    <button class="close-settings" id="closeSettings">Cerrar</button>
  `;
  document.getElementById('app').appendChild(ov);
  // Bluetooth FC
  const btBtn = document.getElementById('btConnectBtn');
  const btStatus = document.getElementById('btStatus');
  if(btBtn) btBtn.onclick = async ()=>{
    btStatus.textContent = 'Buscando dispositivos...';
    const ok = await btPair();
    if(ok){
      btStatus.textContent = '✓ Emparejado: '+state.btDeviceName+(state.btLiveHr ? ' · ♥ '+state.btLiveHr : ' (esperando señal...)');
      btStatus.style.color = 'var(--walk)';
    } else {
      btStatus.textContent = state.btDeviceName ? 'Emparejado: '+state.btDeviceName : 'Conectar sensor FC';
      btStatus.style.color = '';
    }
  };
  // Permisos — verificar estado actual y manejar solicitudes
  const notifBtn = document.getElementById('permNotifBtn');
  const notifStatus = document.getElementById('notifStatus');
  const gpsBtn = document.getElementById('permGpsBtn');
  const gpsPermStatus = document.getElementById('gpsPermStatus');
  async function refreshPermStatus(){
    // Notificaciones
    if(!('Notification' in window)){
      notifStatus.textContent = 'no disponible en este navegador';
    } else if(Notification.permission === 'granted'){
      notifStatus.textContent = '✓ Concedido';
      notifStatus.style.color = 'var(--walk)';
    } else if(Notification.permission === 'denied'){
      notifStatus.textContent = '✗ Denegado — ve a Ajustes del navegador para activarlo';
      notifStatus.style.color = 'var(--danger)';
    } else {
      notifStatus.textContent = 'Toca para conceder permiso';
    }
    // GPS
    if(!('geolocation' in navigator)){
      gpsPermStatus.textContent = 'no disponible';
    } else {
      try{
        const p = await navigator.permissions.query({name:'geolocation'});
        if(p.state === 'granted'){ gpsPermStatus.textContent = '✓ Concedido'; gpsPermStatus.style.color='var(--walk)'; }
        else if(p.state === 'denied'){ gpsPermStatus.textContent = '✗ Denegado — ve a Ajustes del navegador'; gpsPermStatus.style.color='var(--danger)'; }
        else { gpsPermStatus.textContent = 'Toca para conceder permiso'; }
      }catch(e){ gpsPermStatus.textContent = 'Toca para conceder permiso'; }
    }
  }
  refreshPermStatus();
  notifBtn.onclick = async ()=>{
    if(Notification.permission === 'denied'){
      alert('El permiso de notificaciones fue denegado previamente. Ve a Ajustes de Android → Apps → Samsung Internet → Permisos → Notificaciones → Permitir.');
      return;
    }
    const result = await Notification.requestPermission();
    refreshPermStatus();
    if(result === 'granted') notify('✓ Notificaciones activadas', 'Recibirás avisos aunque la pantalla esté bloqueada.');
  };
  gpsBtn.onclick = ()=>{
    if(!('geolocation' in navigator)){ alert('Tu navegador no soporta geolocalización.'); return; }

      ()=> refreshPermStatus(),
      err=>{
        if(err.code === 1) alert('GPS denegado. Ve a Ajustes de Android → Apps → Samsung Internet → Permisos → Ubicación → Permitir siempre.');
        refreshPermStatus();
      },
      {enableHighAccuracy:true, timeout:8000}
    );

  document.getElementById('swVoice').onclick = (e)=>{ state.settings.voice=!state.settings.voice; e.target.classList.toggle('on'); persistSettings(); };
  document.getElementById('swGps').onclick = (e)=>{ state.settings.gps=!state.settings.gps; e.target.classList.toggle('on'); persistSettings(); };
  document.getElementById('swVib').onclick = (e)=>{ state.settings.vibrate=!state.settings.vibrate; e.target.classList.toggle('on'); persistSettings(); };
  const urlInput = document.getElementById('proxyUrlInput');
  const secretInput = document.getElementById('proxySecretInput');
  urlInput.onchange = ()=>{ state.settings.proxyUrl = urlInput.value.trim().replace(/\/$/,''); persistSettings(); };
  secretInput.onchange = ()=>{ state.settings.proxySecret = secretInput.value.trim(); persistSettings(); };
  document.getElementById('testProxyBtn').onclick = async ()=>{
    const resEl = document.getElementById('proxyTestResult');
    resEl.textContent = 'Probando...';
    const r = await fetchHeartRate();
    if(r && r.bpm) resEl.textContent = `✓ Conectado. FC actual: ${Math.round(r.bpm)} bpm`;
    else resEl.textContent = '✗ No se pudo conectar. Revisa la URL, el token, y que tengas Tailscale activo.';
  };
  document.getElementById('closeSettings').onclick = ()=> ov.remove();
};

loadPersisted();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
